<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: fonttt;
            src: url(./slack-on-christmas-font/fonttt.ttf);
        }
        *{
            margin:0;
            padding: 0;
            font-family: fonttt;
            text-align: center;
            
        }
        #myId{
            color: green;
        }
        .myclass{
            color: blue;
        }
        input[type="email"]{

            color: red;
        }
        input[type="password"]{

            color: blue;
        }
    </style>
</head>
<body>
    <h2>Selectors</h2>
    <ul>
        <li class="myclass">Universal</li>
        <li id="myId">Id</li>
        <li class="myclass">Class</li>
        <li>Attribute</li>
        <li>Element Name</li>
        <li>Combinators</li>
        <li>Pseudo Class</li>
        <li>Pseudo Elements</li>
    </ul>
    <input type="email" placeholder="Email">
    <br>
    <input type="password" placeholder="Password">
</body>
</html>
