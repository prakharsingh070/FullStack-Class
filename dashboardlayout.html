<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: aliceblue;
        }
        .container{
            display: flex;
        }
        .sidebar{
            background-color: black;
            width: 150px;
            height: 100vh;
            color: white;
            padding: 20px;

        }
        .sidebar>h2{
            padding: 20px;
            font-weight: 200;
        }
        li{
            margin: 15px;
        }
        ul{
            list-style: none;
        }
        .overview{
            background-color: white;
            color: black;
            font-weight: 300;
            border-radius: 10px;
            margin: 15px;
            width: 1200px;
            height: 50px;
            display: flex;
            align-items: center;
            padding: 10px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">

            <h2>Dashboard</h2>
            <ul>
                <li>Dashboard</li>
                <li>Products</li>
                <li>Users</li>
                <li>About</li>
                <li>Help</li>
                <li>Setting</li>

            </ul>
        </div>
        <div class="dash">
            <div class="overview">
                <h2>Dashboard overview</h2>
            </div>
        </div>
    </div>
</body>
</html>
