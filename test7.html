<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .grad{
            background-color: black;
            height: 300px;
            width: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: bold;
            border: 5px solid transparent;
            border-radius: 5px;
            border-color: black;
            
            
        }
        .box{
            width: 200px;
            height: 200px;
            border: 7px solid;
            border-image: linear-gradient(250deg,blue,red,yellow)1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
        }
        .font{
            font-size: 100px;
            text-align: center;
            background: linear-gradient(aqua,white);
            background-clip: text;
            font-weight: 70;
            color: transparent;            

        }
    </style>
</head>
<body>
    <div class="grad">
        <div class="box">

            <h2>87%</h2>
        </div>
        <div class="font">
            <h1>Box</h1>
        </div>
    </div>
</body>
</html>
