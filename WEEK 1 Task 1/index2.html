<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-screen">
            <div class="quiz-header">
                <span id="progress-line">Q-1/3</span>
                <span id="score">Score: 0</span>
            </div>
            <div id="timer-bar">
                <div id="timer-display">Time left: <span id="'time-counter">30</span></div>
            </div>
            <div class="question-box">
                <h2 id="question-text">Question PLaceholder</h2>
                <div id="options-container"></div>
            </div>
            <div id="explanation-box" class ="hidden">
                <strong>Explanation</strong>
            </div>
            <div class="quiz-footer">
                <button id="next-btn" class="hidden">Next-Question</button>
            </div>
        </div>

        <div id="end-screen" class="hidden">
            <h2>Quiz Completed</h2>
            <p id="final-score"></p>
            <p id="rating-message"></p>

            <div class="end-actions">
                <button id="review-btn">Review wrong answer</button>
                <button id="restart-btn">Restart quiz</button>
            </div>
        </div>
        <div class="hidden" id="review-screen">
            <h2>review Wrong Answers</h2>
            <div id="review-container"></div>
            <button id="back-to-end-btn">Back to Summary</button>
        </div>
    </div>


    <Script src="script.js"></Script>
</body>
</html>
