<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Card Match</title>
  <style>
    /* Minimal layout for the 4x4 grid */
    #board {
      display: grid;
      grid-template-columns: repeat(4, 70px);
      gap: 10px;
      margin-top: 15px;
    }

    .card {
      width: 70px;
      height: 70px;
      border: 1px solid black;
      background-color: lightgray;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      user-select: none;
    }

    .flipped {
      background-color: white;
    }
  </style>
</head>
<body>

  <h2>Memory Card Match</h2>
  <button id="restart-btn">Restart Game</button>
  <p>Matches found: <span id="matches">0</span> / 8</p>

  <div id="board"></div>

  <script src="index.js"></script>
</body>
</html>
