<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercedes Navbar</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
        }

        .navbar {
            height: 72px;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 28px;
            color: #fff;
        }

        .nav-inner {
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
        }

        .nav-left,
        .nav-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-right {
            justify-content: flex-end;
        }

        .nav-left {
            justify-content: flex-start;
        }

        .nav-item {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
        }

        .logo-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.9);
            display: grid;
            place-items: center;
            position: relative;
            margin: 0 auto;
        }

        .logo:before,
        .logo:after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            opacity: 0.92;
        }

        .logo:before {
            left: 7px;
            top: 8px;
            transform: rotate(30deg);
        }

        .logo:after {
            right: 7px;
            top: 8px;
            transform: rotate(-30deg);
        }

        .logo-center {
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            z-index: 1;
        }

        .icon-group {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
            position: relative;
        }

        .search {
            border: 2px solid #fff;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            margin-top: 1px;
        }

        .search:after {
            content: "";
            position: absolute;
            width: 7px;
            height: 2px;
            background: #fff;
            right: -4px;
            bottom: -1px;
            transform: rotate(45deg);
            border-radius: 2px;
        }

        .heart {
            width: 18px;
            height: 18px;
        }

        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            width: 10px;
            height: 16px;
            background: #fff;
            border-radius: 10px 10px 0 0;
            top: 2px;
        }

        .heart:before {
            left: 2px;
            transform: rotate(-45deg);
            transform-origin: bottom right;
        }

        .heart:after {
            right: 2px;
            transform: rotate(45deg);
            transform-origin: bottom left;
        }

        .profile {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            position: relative;
        }

        .profile:before {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
            left: 50%;
            top: 4px;
            transform: translateX(-50%);
        }

        .profile:after {
            content: "";
            position: absolute;
            width: 13px;
            height: 7px;
            background: #000;
            border-radius: 10px 10px 8px 8px;
            left: 50%;
            bottom: 3px;
            transform: translateX(-50%);
        }

        .login {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 900px) {
            .nav-inner {
                grid-template-columns: 1fr auto 1fr;
            }

            .nav-left .nav-item:nth-child(4) {
                display: none;
            }
        }

        @media (max-width: 700px) {
            .nav-inner {
                grid-template-columns: auto 1fr auto;
            }

            .nav-left {
                display: none;
            }

            .nav-right {
                gap: 12px;
            }

            .login {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="nav-inner">
            <nav class="nav-left" aria-label="Main Navigation">
                <a href="#" class="nav-item">Models</a>
                <a href="#" class="nav-item">Buy</a>
                <a href="#" class="nav-item">Services</a>
                <a href="#" class="nav-item">Brand</a>
            </nav>

            <div class="logo-wrap" aria-label="Mercedes logo">
                <div class="logo">
                    <div class="logo-center"></div>
                </div>
            </div>

            <div class="nav-right">
                <a href="#" class="nav-item">Provider/...</a>
                <div class="icon-group">
                    <span class="icon search" aria-label="Search"></span>
                    <span class="icon heart" aria-label="Wishlist"></span>
                    <span class="profile" aria-label="Profile"></span>
                </div>
                <a href="#" class="login">Private customer</a>
            </div>
        </div>
    </header>
</body>
</html>
