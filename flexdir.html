<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            flex-direction: row;
            outline: 3px solid black;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container>div{
            color: white;
            /* width: 150px; */
            height: 100px;

        }
        .box1{
            background-color: aqua;
            flex-basis: 150px;

        }
        .box2{
            background-color: brown;
            flex-flow: 2;
        }
        .box3{
            background-color: yellow;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">Box1</div>
        <div class="box2">Box2</div>
        <div class="box3">Box3</div>
    </div>

</body>
</html>
