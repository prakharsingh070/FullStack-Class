<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virat Kohli Shots</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
}

.container{
    width:100%;
}

.slide{
    position:sticky;
    top:10px;
    width:80%;
    height:80vh;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    
    background-image: linear-gradient(red, orange);
}


.slide img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(0.75);
    transition:0.5s;
}


/* dark fade layer */
.slide::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,0.8),
        transparent
    );
}


/* heading */
.slide h1{
    position:relative;
    z-index:2;
    color:white;
    font-size:50px;
    padding:40px;
    text-transform:uppercase;
    letter-spacing:2px;
}


/* scrolling space */
.spacer{
    height:100vh;
}


</style>

</head>

<body>


<div class="container">


<div class="slide">
    <img src="https://thefederal.com/h-upload/2023/10/19/418006-virat-kohli-ind-ban-wc2.webp">
    <h1>Virat Kohli Shots Range</h1>
</div>

<div class="spacer"></div>


<div class="slide">
    <img src="https://img1.hscicdn.com/image/upload/f_auto,t_ds_w_1200/lsci/db/PICTURES/CMS/264200/264272.jpg">
    <h1>PULL</h1>
</div>

<div class="spacer"></div>


<div class="slide">
    <img src="https://img1.hscicdn.com/image/upload/f_auto/lsci/db/PICTURES/CMS/361600/361627.jpg">
    <h1>Cover Drive</h1>
</div>

<div class="spacer"></div>


<div class="slide">
    <img src="https://statico.sportskeeda.com/editor/2024/05/c47d0-17170589973045.webp">
    <h1>SLOG</h1>
</div>


</div>


</body>
</html>
