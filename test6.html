<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess the Number Game (7 Choices)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .game-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 320px;
    }
    input[type="number"] {
      width: 80%;
      padding: 8px;
      margin: 10px 0;
      font-size: 16px;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h2>Guess the Number</h2>
    <p>Pick a number between 1 and 100.</p>
    <p>You have <span id="chancesLeft">7</span> choices left.</p>
    
    <input type="number" id="guessInput" min="1" max="100" placeholder="Enter your guess">
    <br>
    <button onclick="checkGuess()">Submit Guess</button>
    
    <p id="message"></p>
    <button id="restartBtn" style="display:none; margin-top: 10px;" onclick="resetGame()">Play Again</button>
  </div>

  <script>
    let randomNumber = Math.floor(Math.random() * 100) + 1;
    let maxChances = 7;
    let chancesLeft = maxChances;
    let isGameOver = false;

    const guessInput = document.getElementById('guessInput');
    const message = document.getElementById('message');
    const chancesLeftSpan = document.getElementById('chancesLeft');
    const restartBtn = document.getElementById('restartBtn');

    function checkGuess() {
      if (isGameOver) return;

      const userGuess = parseInt(guessInput.value);

      if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
        message.style.color = 'orange';
        message.textContent = 'Please enter a valid number between 1 and 100.';
        return;
      }

      chancesLeft--;
      chancesLeftSpan.textContent = chancesLeft;

      if (userGuess === randomNumber) {
        message.style.color = 'green';
        message.textContent = `🎉 Congratulations! You guessed the number ${randomNumber}!`;
        endGame();
      } else if (chancesLeft === 0) {
        message.style.color = 'red';
        message.textContent = `❌ Game Over! The secret number was ${randomNumber}.`;
        endGame();
      } else if (userGuess < randomNumber) {
        message.style.color = 'blue';
        message.textContent = 'Too low! Try a higher number.';
      } else if (userGuess > randomNumber) {
        message.style.color = 'blue';
        message.textContent = 'Too high! Try a lower number.';
      }

      guessInput.value = '';
      guessInput.focus();
    }

    function endGame() {
      isGameOver = true;
      guessInput.disabled = true;
      restartBtn.style.display = 'inline-block';
    }

    function resetGame() {
      randomNumber = Math.floor(Math.random() * 100) + 1;
      chancesLeft = maxChances;
      isGameOver = false;
      guessInput.disabled = false;
      guessInput.value = '';
      chancesLeftSpan.textContent = chancesLeft;
      message.textContent = '';
      restartBtn.style.display = 'none';
      guessInput.focus();
    }

    // Allow pressing 'Enter' key to submit
    guessInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkGuess();
      }
    });
  </script>

</body>
</html>
