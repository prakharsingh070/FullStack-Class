<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: black;
            color: white;
        }
        .page {
            position: relative;
            min-height: 100vh;
            background: url('bg_image.jpg') no-repeat center center / cover;
            overflow: hidden;
        }
        .page::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
        }
        .topbar {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
        }
        .logo img {
            width: 170px;
            display: block;
        }
        .menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .lang {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            border-radius: 5px;
            padding: 9px 16px;
            font-size: 14px;
        }
        .signout {
            background: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .hero {
            position: relative;
            z-index: 1;
            text-align: center;
            padding-top: 120px;
        }

        .hero h1 {
            margin: 0;
            font-size: 64px;
            line-height: 1.1;
            font-weight: 900;
        }

        .hero p {
            margin-top: 18px;
            font-size: 26px;
        }

        .btn {
            margin-top: 22px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 22px 36px;
            font-size: 26px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="topbar">

            <div class="logo">
                <img src="logo.svg" alt="">
            </div>
            <div class="menu">
                <div class="lang">English</div>
                <button class="sign">Sign Out</button>
            </div>
        </header>

        <main class="hero">
            <h1>Unlimited movies,<br>shows, and more</h1>
            <p>Starts at ₹149. Cancel at any time.</p>
            <button class="btn">Restart Your Membership</button>
        </main>
    </div>
</body>
</html>
