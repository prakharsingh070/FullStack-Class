<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustache With Pseudo Elements</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #f2efe7, #ddd6c3);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .face {
            position: relative;
            width: 260px;
            height: 220px;
        }

        .eye {
            position: absolute;
            top: 35px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #1f1f1f;
        }

        .eye::after {
            content: "";
            position: absolute;
            top: 12px;
            left: 12px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #1f1f1f;
        }

        .eye.left {
            left: 66px;
        }

        .eye.right {
            right: 66px;
        }

        .nose {
            position: absolute;
            top: 92px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 30px;
            border-radius: 40% 40% 55% 55%;
            background: #b78353;
            border: 2px solid #8d6038;
        }

        .mustache {
            position: relative;
            width: 220px;
            height: 70px;
            margin: 128px auto 0;
        }

        .mustache::before,
        .mustache::after {
            content: "";
            position: absolute;
            top: 10px;
            width: 110px;
            height: 55px;
            border-bottom: 55px solid #1f1f1f;
            border-radius: 0 0 110px 110px;
        }

        .mustache::before {
            left: 0;
            transform: rotate(14deg);
            transform-origin: right top;
        }

        .mustache::after {
            right: 0;
            transform: rotate(-14deg);
            transform-origin: left top;
        }
    </style>
</head>
<body>
    <div class="face">
        <span class="eye left"></span>
        <span class="eye right"></span>
        <div class="nose"></div>
        <div class="mustache"></div>
    </div>
</body>
</html>
